[project]
name = "ai-job-application-agent-backend"
version = "0.1.0"
description = "Backend for the AI Job Application Agent (vertical slice 1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "email-validator==2.2.0",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pgvector==0.3.6",
    "redis==5.2.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.2.1",
    "python-multipart==0.0.20",
    "pdfplumber==0.11.4",
    "pypdf==5.1.0",
    "beautifulsoup4==4.12.3",
    "cloudinary==1.41.0",
    "litellm==1.56.4",
    "langgraph==0.2.62",
    "langgraph-checkpoint==2.0.9",
    "langgraph-checkpoint-sqlite==2.0.1",
    "langchain-core==0.3.28",
    "playwright==1.49.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.1",
    "httpx>=0.27,<0.28",
    "aiosqlite==0.20.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
